<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Glow Habit Tracker</title>
    <!-- Подключаем шрифт и иконки -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --glow-blue: #58a6ff;
            --glow-green: #3fb950;
            --glow-red: #f85149;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            padding-bottom: 100px; /* Место для кнопки плюс */
        }

        h1 { font-size: 24px; margin-bottom: 20px; font-weight: 600; }

        /* Сетка для карточек */
        .habits-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Карточка привычки (Glow UI) */
        .habit-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        /* Свечение при активности */
        .habit-card.active {
            border-color: var(--glow-blue);
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.2);
        }

        .habit-info h3 { font-size: 18px; margin-bottom: 4px; }
        .habit-info p { font-size: 14px; color: var(--text-muted); }
        
        .habit-status {
            font-size: 12px;
            color: var(--glow-blue);
            margin-top: 6px;
            display: inline-block;
            padding: 2px 8px;
            background: rgba(88, 166, 255, 0.1);
            border-radius: 10px;
        }

        /* Кнопки управления */
        .action-btn {
            background: none;
            border: 2px solid var(--border-color);
            color: var(--text-main);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        /* Разные цвета для разных типов */
        .action-btn.btn-timer { border-color: var(--glow-blue); color: var(--glow-blue); }
        .action-btn.btn-timer:hover { box-shadow: 0 0 15px var(--glow-blue); background: rgba(88,166,255,0.1); }
        
        .action-btn.btn-bool { border-color: var(--glow-green); color: var(--glow-green); }
        .action-btn.btn-bool:hover { box-shadow: 0 0 15px var(--glow-green); background: rgba(63,185,80,0.1); }
        .action-btn.btn-bool.completed { background: var(--glow-green); color: #000; box-shadow: 0 0 15px var(--glow-green); }

        .action-btn.btn-count { border-color: #d2a8ff; color: #d2a8ff; }
        .action-btn.btn-count:hover { box-shadow: 0 0 15px #d2a8ff; background: rgba(210,168,255,0.1); }

        /* Кнопка Плюс (FAB) */
        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--bg-color);
            border: 2px solid var(--glow-blue);
            color: var(--glow-blue);
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(88, 166, 255, 0.4);
            transition: 0.3s;
            z-index: 10;
        }
        .fab:active { transform: scale(0.95); }

        /* Модальное окно (Создание) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        .modal-content h2 { margin-bottom: 20px; font-size: 20px; text-align: center; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
        
        .form-group input, .form-group select {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--glow-blue);
            box-shadow: 0 0 10px rgba(88, 166, 255, 0.2);
        }

        .form-row { display: flex; gap: 10px; }
        .form-row .form-group { flex: 1; }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: rgba(88, 166, 255, 0.1);
            border: 1px solid var(--glow-blue);
            color: var(--glow-blue);
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        .btn-submit:active { background: var(--glow-blue); color: #000; box-shadow: 0 0 20px var(--glow-blue); }

        .close-modal {
            position: absolute;
            top: 15px; right: 15px;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
            background: none;
            border: none;
        }
        
        /* Скрытие полей в зависимости от типа */
        .hidden { display: none; }
    </style>
</head>
<body>

    <h1>Мои привычки</h1>
    <div class="habits-grid" id="habits-list">
        <!-- Сюда будут добавляться карточки -->
    </div>

    <!-- Кнопка Плюс -->
    <button class="fab" onclick="openModal()"><i class="fas fa-plus"></i></button>

    <!-- Модальное окно создания -->
    <div class="modal-overlay" id="habit-modal">
        <div class="modal-content" style="position: relative;">
            <button class="close-modal" onclick="closeModal()"><i class="fas fa-times"></i></button>
            <h2>Новая привычка</h2>
            
            <div class="form-group">
                <label>Название</label>
                <input type="text" id="habit-name" placeholder="Например: Чтение">
            </div>

            <div class="form-group">
                <label>Описание</label>
                <input type="text" id="habit-desc" placeholder="Например: 10 страниц в день">
            </div>

            <div class="form-group">
                <label>Тип привычки</label>
                <select id="habit-type" onchange="toggleFormFields()">
                    <option value="bool">Да/Нет (Выполнено)</option>
                    <option value="count">Повторение (Счетчик)</option>
                    <option value="timer">Время (Таймер)</option>
                </select>
            </div>

            <!-- Поля для счетчика -->
            <div class="form-row hidden" id="count-fields">
                <div class="form-group">
                    <label>Цель (сколько раз)</label>
                    <input type="number" id="habit-target" value="3" min="1">
                </div>
            </div>

            <!-- Поля для таймера -->
            <div class="form-row hidden" id="timer-fields">
                <div class="form-group">
                    <label>Время (в минутах)</label>
                    <input type="number" id="habit-time" value="10" min="1">
                </div>
            </div>

            <button class="btn-submit" onclick="addHabit()">Добавить</button>
        </div>
    </div>

    <script>
        // Массив для хранения привычек
        let habits = JSON.parse(localStorage.getItem('glow_habits')) || [];

        // Функция отрисовки всех карточек
        function renderHabits() {
            const list = document.getElementById('habits-list');
            list.innerHTML = '';

            if (habits.length === 0) {
                list.innerHTML = '<p style="color: var(--text-muted); text-align: center; margin-top: 50px;">Нет привычек. Нажмите + чтобы добавить.</p>';
                return;
            }

            habits.forEach(habit => {
                const card = document.createElement('div');
                card.className = `habit-card ${habit.isRunning ? 'active' : ''}`;
                card.id = `card-${habit.id}`;

                let statusText = '';
                let btnHtml = '';

                // Логика отображения для разных типов
                if (habit.type === 'bool') {
                    statusText = habit.current === 1 ? 'Выполнено сегодня' : 'Не выполнено';
                    btnHtml = `<button class="action-btn btn-bool ${habit.current === 1 ? 'completed' : ''}" onclick="toggleBool('${habit.id}')"><i class="fas ${habit.current === 1 ? 'fa-check' : 'fa-minus'}"></i></button>`;
                } 
                else if (habit.type === 'count') {
                    statusText = `Прогресс: ${habit.current} / ${habit.target}`;
                    btnHtml = `<button class="action-btn btn-count" onclick="incrementCount('${habit.id}')"><i class="fas fa-plus"></i></button>`;
                } 
                else if (habit.type === 'timer') {
                    statusText = habit.isRunning ? `Осталось: ${habit.timeLeft} сек.` : `Цель: ${habit.target} мин.`;
                    btnHtml = `<button class="action-btn btn-timer" onclick="toggleTimer('${habit.id}')"><i class="fas ${habit.isRunning ? 'fa-pause' : 'fa-play'}"></i></button>`;
                }

                card.innerHTML = `
                    <div class="habit-info">
                        <h3>${habit.name}</h3>
                        <p>${habit.desc || ''}</p>
                        <span class="habit-status" id="status-${habit.id}">${statusText}</span>
                    </div>
                    ${btnHtml}
                `;
                list.appendChild(card);
            });
        }

        // Сохранение в память телефона
        function saveHabits() {
            // Убираем таймеры из сохранения, чтобы не ломать JSON
            const toSave = habits.map(h => {
                let copy = {...h};
                delete copy.intervalId;
                return copy;
            });
            localStorage.setItem('glow_habits', JSON.stringify(toSave));
        }

        // Открытие/закрытие модалки
        function openModal() { document.getElementById('habit-modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('habit-modal').style.display = 'none'; }

        // Показ нужных полей в зависимости от типа
        function toggleFormFields() {
            const type = document.getElementById('habit-type').value;
            document.getElementById('count-fields').classList.toggle('hidden', type !== 'count');
            document.getElementById('timer-fields').classList.toggle('hidden', type !== 'timer');
        }

        // Добавление привычки
        function addHabit() {
            const name = document.getElementById('habit-name').value.trim();
            const desc = document.getElementById('habit-desc').value.trim();
            const type = document.getElementById('habit-type').value;
            const target = type === 'count' ? parseInt(document.getElementById('habit-target').value) : (type === 'timer' ? parseInt(document.getElementById('habit-time').value) : 1);

            if (!name) { alert('Введите название!'); return; }

            const newHabit = {
                id: Date.now().toString(),
                name: name,
                desc: desc,
                type: type,
                target: target,
                current: 0,
                timeLeft: target * 60, // в секундах
                isRunning: false
            };

            habits.push(newHabit);
            saveHabits();
            renderHabits();
            closeModal();

            // Очистка полей
            document.getElementById('habit-name').value = '';
            document.getElementById('habit-desc').value = '';
        }

        // Логика Да/Нет
        function toggleBool(id) {
            const habit = habits.find(h => h.id === id);
            if (habit) {
                habit.current = habit.current === 1 ? 0 : 1;
                saveHabits();
                renderHabits();
            }
        }

        // Логика Счетчика
        function incrementCount(id) {
            const habit = habits.find(h => h.id === id);
            if (habit) {
                habit.current += 1;
                if (habit.current > habit.target) {
                    habit.current = 0; // Сброс, если перевыполнили
                }
                saveHabits();
                renderHabits();
            }
        }

        // Логика Таймера
        function toggleTimer(id) {
            let habit = habits.find(h => h.id === id);
            if (!habit) return;

            if (habit.isRunning) {
                // Стоп
                clearInterval(habit.intervalId);
                habit.isRunning = false;
            } else {
                // Старт
                habit.isRunning = true;
                
                // Если время вышло, сбрасываем на начало
                if (habit.timeLeft <= 0) habit.timeLeft = habit.target * 60;

                habit.intervalId = setInterval(() => {
                    habit.timeLeft--;
                    
                    // Обновляем текст только у этой карточки (чтобы не тормозило всё)
                    const statusEl = document.getElementById(`status-${habit.id}`);
                    if (statusEl) {
                        const min = Math.floor(habit.timeLeft / 60);
                        const sec = habit.timeLeft % 60;
                        statusEl.innerText = `Осталось: ${min}:${sec < 10 ? '0' : ''}${sec}`;
                    }

                    if (habit.timeLeft <= 0) {
                        clearInterval(habit.intervalId);
                        habit.isRunning = false;
                        habit.timeLeft = 0;
                        saveHabits();
                        renderHabits();
                        alert(`Привычка "${habit.name}" выполнена!`);
                    }
                }, 1000);
            }
            
            // Обновляем иконку (плей/пауза)
            renderHabits();
        }

        // Запуск при открытии
        renderHabits();
    </script>
</body>
</html>
