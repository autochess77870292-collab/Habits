<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Glow Habit Tracker</title>
    <!-- Подключаем шрифт и иконки -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Подключаем наш файл дизайна -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Мои привычки</h1>
    <div class="habits-grid" id="habits-list"></div>

    <button class="fab" onclick="openModal()"><i class="fas fa-plus"></i></button>

    <div class="modal-overlay" id="habit-modal">
        <div class="modal-content" style="position: relative;">
            <button class="close-modal" onclick="closeModal()"><i class="fas fa-times"></i></button>
            <h2>Новая привычка</h2>
            
            <div class="form-group">
                <label>Название</label>
                <input type="text" id="habit-name" placeholder="Например: Чтение">
            </div>

            <div class="form-group">
                <label>Описание</label>
                <input type="text" id="habit-desc" placeholder="Например: 10 страниц в день">
            </div>

            <div class="form-group">
                <label>Тип привычки</label>
                <select id="habit-type" onchange="toggleFormFields()">
                    <option value="bool">Да/Нет (Выполнено)</option>
                    <option value="count">Повторение (Счетчик)</option>
                    <option value="timer">Время (Таймер)</option>
                </select>
            </div>

            <div class="form-row hidden" id="count-fields">
                <div class="form-group">
                    <label>Цель (сколько раз)</label>
                    <input type="number" id="habit-target" value="3" min="1">
                </div>
            </div>

            <div class="form-row hidden" id="timer-fields">
                <div class="form-group">
                    <label>Время (в минутах)</label>
                    <input type="number" id="habit-time" value="10" min="1">
                </div>
            </div>

            <button class="btn-submit" onclick="addHabit()">Добавить</button>
        </div>
    </div>

    <!-- Подключаем наш файл логики -->
    <script src="app.js"></script>
</body>
</html>
